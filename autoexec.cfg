// ============================================
// Clean Apex Legends Autoexec - made by kretz1xD
// Focus: Lower input lag + higher/more stable FPS
// ============================================

// --- Reload / Utility Binds ---
bind_US_standard "F7" "disconnect"
bind_US_standard "F8" "miles_reboot; miles_stop_all"          // Restart audio engine (fixes stuck sounds)
bind_US_standard "F9" "toggle sound_volume 0 0.15 0.35"        // Quick volume mute / low / normal
bind_US_standard "F12" "exec autoexec.cfg"                        // Reload this config


// --- Core Latency & Performance ---
fps_max 0                                         // Uncapped (use in-game Reflex + external cap if needed)
mat_queue_mode 2                                  // Force multi-threaded rendering
cl_forcepreload 1                                 // Preload assets (can reduce mid-game stutters)

// --- Visual Clutter & FPS Gains (Safe) ---
cl_ragdoll_maxcount 0                             // Disable ragdolls
cl_ragdoll_self_collision 0
r_createmodeldecals 0                             // No bullet hole decals on models
r_decals 0                                        // Disable most decals
particle_cpu_level 0
mat_reduceparticles 1
r_drawtracers_firstperson 0                       // No first-person bullet tracers
violence_ablood 0
violence_hblood 0
cl_ejectbrass 0                                   // No shell casings
cl_show_splashes 0                                // No water splashes



// --- Shadows / Post-Processing (Big FPS improvement) ---
ssao_enabled 0
shadow_enable 0
r_shadows 0
r_shadowmaxrendered 0
r_shadowrendertotexture 0
mat_shadowstate 0
mat_bloom_scalefactor_scalar 0
mat_disable_bloom 1
mat_postprocess_enable 0
mat_dynamic_tonemapping 0
mat_hdr_level 0
noise_filter_scale 0                              // Removes film grain

// --- Texture / LOD Optimizations ---
mat_forceaniso 0                                  // Disable anisotropic filtering
mat_mip_linear 0
stream_drop_unused 1

// --- Water / Fog (Minor gains) ---
r_forcecheapwater 1
r_waterdrawreflection 0
r_waterforceexpensive 0
fog_enable 0

// --- Network (Conservative / Safe) ---
cl_lagcompensation 1
cl_smooth 0
cl_smoothtime 0.01
cl_interp 0
cl_interp_ratio 1
cl_predict 1
cl_predictweapons 1
rate 128000                                       // Safe modern value

// --- Telemetry / Privacy (Harmless) ---
telemetry_client_enable 0
pin_opt_in 0
voice_forcemicrecord 0

// --- Misc Quality of Life ---
mat_vsync_mode 0                                  // Make sure V-Sync stays off
cl_showpos 0                                      // Turn on with bind if you want velocity
